# SISPAC-RO: plano para a SEAS. É o exemplo de referência do molde "Proposta".
# Gerar: python3 moldes/gerar.py moldes/exemplos/sispac-ro/conteudo.yaml
# Correção em relação ao PDF original de 09/10: 2021 tem 21 termos de fomento com entidades, não 20
# (a APAE "do Município de Santa Luzia D'Oeste" tinha sido contada como prefeitura).

documento:
  produto: SISPAC-RO
  slogan: Rondônia conectada pelo cuidado
  arquivo: SEAS-SISPAC-PLANO-DE-GOVERNO
  titulo_pdf: SISPAC-RO · plano
  autoria: NextTech Ecosystem

capa:
  topo: [Estado de Rondônia, Proposta com dados públicos]
  kicker: PROPOSTA PARA A SEAS · OUTUBRO DE 2026
  titulo: SISPAC-RO
  subtitulo: Sistema Integrado de Parcerias e Assistência Comunitária de Rondônia
  slogan: Rondônia conectada pelo cuidado
  texto: Um sistema para ajudar as entidades e associações a fazer plano de trabalho, cotações, relatórios e prestação de contas, e para a SEAS acompanhar cada parceria.
  pe: Secretaria de Estado da Mulher, da Família, da Assistência e do Desenvolvimento Social
  # autoria_capa: "NextTech\nEcosystem"   (opcional; padrão = documento.autoria)

paginas:
  - kicker: A proposta
    titulo: A ideia em uma frase
    blocos:
      - espaco: 12
      - frase: As entidades fazem o trabalho social. O **SISPAC-RO** ajuda a fazer o papel. Ele cuida do plano de trabalho, das cotações, dos relatórios e da prestação de contas, e a SEAS acompanha cada etapa.
      - espaco: 6
      - destaques:
          - [Menos burocracia, para quem ajuda]
          - [Mais clareza, para quem administra]
          - [Mais acesso, para quem precisa]

  - kicker: Sumário
    titulo: O que este plano apresenta
    blocos:
      - sumario:
          nota: "Todos os números vêm de fontes públicas: Portal da Transparência de Rondônia, Ministério do Desenvolvimento e Assistência Social (MDS) e IBGE. A lista completa está na última página."

  - secao: O problema das entidades
    titulo: As parcerias cresceram mais rápido que o apoio a elas
    fonte: "Fonte: Portal da Transparência de Rondônia, convênios da SEAS (2019–2026) e despesa por órgão (posição 07/10/2026). Valor típico = mediana do valor celebrado."
    blocos:
      - colunas:
          titulo: Termos de fomento da SEAS com entidades, por ano de assinatura
          itens: [[2019, 3], [2020, 0], [2021, 21], [2022, 33], [2023, 18], [2024, 61], [2025, 99], [2026, 10]]
          destaque: 2025
          nota: "2026: até 8 de outubro."
      - kpis:
          - ["18 → 99", "termos de fomento por ano, de 2023 para 2025"]
          - [85 de 139, entidades fizeram uma única parceria com a SEAS]
          - [R$ 100 mil, é o valor típico de uma parceria com entidade]
      - conclusao: São associações pequenas, muitas vezes na primeira parceria com o Estado, sem equipe para cuidar da papelada.

  - secao: O problema das entidades
    titulo: O que uma entidade precisa produzir numa parceria
    fonte: Exigências da Lei 13.019/2014 (Marco Regulatório das Organizações da Sociedade Civil) e dos modelos adotados pela SEAS.
    blocos:
      - grupos:
          - titulo: Antes de assinar
            itens: [Cadastro e documentos da entidade, Orçamento e cotações de preço, Certidões em dia, Declarações exigidas, Plano de trabalho com metas e indicadores]
          - titulo: Durante a execução
            itens: [Registro das despesas e notas fiscais, Ofícios e pedidos de ajuste, Fotos e listas que comprovam as metas, "Relatórios parciais, quando pedidos"]
          - titulo: Ao final
            itens: [Relatório de execução do objeto, Prestação de contas completa, Relatório de execução financeira, Respostas a diligências]
      - conclusao: Para uma associação pequena, isso é um segundo trabalho, feito por voluntários e muitas vezes sem orientação.

  - secao: O problema das entidades
    titulo: Onde a parceria costuma travar
    fonte: "Fonte: Portal da Transparência de Rondônia, convênios da SEAS (2019–2026) e despesa por órgão (posição 07/10/2026)."
    blocos:
      - cartoes:
          - [Conhecimento técnico, null, Plano de trabalho e prestação de contas pedem linguagem e formato que a entidade não domina.]
          - [Retrabalho, null, "Documentos voltam para correção, às vezes mais de uma vez, e a parceria atrasa."]
          - [Prazos, null, "Vigência, certidões e prestação vencem sem aviso, e a entidade fica irregular."]
          - [Comprovantes soltos, null, "Notas, fotos e listas se perdem ao longo da execução e faltam na hora de prestar contas."]
      - conclusao: Nos registros da SEAS de 2019 a 2026 aparecem **12 rescisões** e **24 aditivos**. Cada parceria que trava é recurso que demora a chegar.

  - secao: O problema das entidades
    titulo: O recurso social é pequeno e precisa render
    fonte: "Fonte: Portal da Transparência de Rondônia, convênios da SEAS (2019–2026) e despesa por órgão (posição 07/10/2026). Comprometido = empenhado."
    blocos:
      - numero: {valor: R$ 193 mi, rotulo: "para a área social em 2026: 0,9% do orçamento do Estado"}
      - espaco: 2
      - barras:
          titulo: Orçamento atualizado de 2026
          itens:
            - [SEAS, 97.9, "R$ 97,9 mi"]
            - [FECOEP · combate à pobreza, 60.6, "R$ 60,6 mi"]
            - [FEAS · assistência social, 34.6, "R$ 34,6 mi"]
            - [FEDM · direitos da mulher, 0.1, "R$ 0,1 mi"]
          nota: Até 7 de outubro, com 77% do ano corrido, **59%** estava comprometido e **49%** pago.

  - secao: O SISPAC-RO
    titulo: Um software para as duas pontas da parceria
    blocos:
      - espaco: 4
      - caixa: {titulo: SISPAC-RO, subtitulo: Sistema Integrado de Parcerias e Assistência Comunitária de Rondônia, texto: "Um sistema na internet, no celular ou no computador, usado pela entidade e pela SEAS."}
      - secoes:
          - [Para a entidade, Faz a papelada com ela, "Perguntas simples viram plano de trabalho, cotações, relatórios e prestação de contas, no modelo que a SEAS exige."]
          - [Para a SEAS, Mostra cada parceria, "Em que etapa está cada entidade, o que falta, que prazo vence e o que já foi comprovado."]

  - secao: O SISPAC-RO
    titulo: O que o SISPAC-RO ajuda a gerar
    fonte: Modelos ajustados às exigências da SEAS e da Lei 13.019/2014. A entidade revisa e assina; a SEAS analisa e aprova.
    blocos:
