          - [Cronogramas, de execução das metas e de desembolso]
          - [Orçamento e cotações, planilha de custos e cotações de preço organizadas]
          - [Ofícios e declarações, "os documentos pedidos em cada fase, já preenchidos"]
          - [Checklists, "o que falta antes de enviar, item por item"]
          - [Relatórios de execução, "do objeto e financeiro, a partir do que foi registrado"]
          - [Prestação de contas, "reunida a partir da execução, sem refazer nada"]
          - ["Notas, evidências e anexos", "fotos, notas e listas organizadas por meta"]

