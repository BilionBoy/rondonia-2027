<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" font-family="Inter, Arial, sans-serif"><defs><marker id="p-1a56b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a56b8"/></marker><marker id="p-0f2c66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f2c66"/></marker><marker id="p-3f4550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4550"/></marker><marker id="p-c4451c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4451c"/></marker></defs><rect width="1400" height="870" fill="#fff"/><text x="40" y="58" font-size="36" font-weight="800" fill="#0f2c66" text-anchor="start"><tspan x="40" dy="0">Fluxo atual da gestão de materiais e patrimônio</tspan></text><text x="40" y="96" font-size="22" font-weight="400" fill="#3f4550" text-anchor="start"><tspan x="40" dy="0">Modelo típico de funcionamento, a validar por unidade. Sem o SIMA.</tspan></text><rect x="40" y="140" width="250" height="330" rx="12" fill="#f3f6fb" stroke="#c9d3e3" stroke-width="2"/><rect x="40" y="140" width="250" height="96" rx="12" fill="#0f2c66"/><rect x="40" y="210" width="250" height="26" fill="#0f2c66"/><text x="58" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="start"><tspan x="58" dy="0">Escola / unidade</tspan></text><text x="58" y="280" font-size="20" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="58" dy="0">Pede material por</tspan><tspan x="58" dy="25">ofício ou SEI;</tspan><tspan x="58" dy="25">recebe e confere;</tspan><tspan x="58" dy="25">bens em planilha</tspan><tspan x="58" dy="25">local</tspan></text><line x1="291" y1="340" x2="313" y2="340" stroke="#1a56b8" stroke-width="3" marker-end="url(#p-1a56b8)"/><line x1="313" y1="390" x2="291" y2="390" stroke="#3f4550" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#p-3f4550)"/><rect x="315" y="140" width="250" height="330" rx="12" fill="#f3f6fb" stroke="#c9d3e3" stroke-width="2"/><rect x="315" y="140" width="250" height="96" rx="12" fill="#0f2c66"/><rect x="315" y="210" width="250" height="26" fill="#0f2c66"/><text x="333" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="start"><tspan x="333" dy="0">Superintendência</tspan><tspan x="333" dy="30">regional</tspan></text><text x="333" y="280" font-size="20" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="333" dy="0">Reúne pedidos e</tspan><tspan x="333" dy="25">informações das</tspan><tspan x="333" dy="25">escolas; repassa</tspan><tspan x="333" dy="25">por e-mail, planilha</tspan><tspan x="333" dy="25">ou SEI</tspan></text><line x1="566" y1="340" x2="588" y2="340" stroke="#1a56b8" stroke-width="3" marker-end="url(#p-1a56b8)"/><line x1="588" y1="390" x2="566" y2="390" stroke="#3f4550" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#p-3f4550)"/><rect x="590" y="140" width="250" height="330" rx="12" fill="#f3f6fb" stroke="#c9d3e3" stroke-width="2"/><rect x="590" y="140" width="250" height="96" rx="12" fill="#0f2c66"/><rect x="590" y="210" width="250" height="26" fill="#0f2c66"/><text x="608" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="start"><tspan x="608" dy="0">Almoxarifado e</tspan><tspan x="608" dy="30">patrimônio</tspan></text><text x="608" y="280" font-size="20" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="608" dy="0">Estoque no SGA;</tspan><tspan x="608" dy="25">tombamento e</tspan><tspan x="608" dy="25">movimentação no</tspan><tspan x="608" dy="25">e-Estado;</tspan><tspan x="608" dy="25">conferência manual</tspan></text><line x1="841" y1="340" x2="863" y2="340" stroke="#1a56b8" stroke-width="3" marker-end="url(#p-1a56b8)"/><line x1="863" y1="390" x2="841" y2="390" stroke="#3f4550" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#p-3f4550)"/><rect x="865" y="140" width="250" height="330" rx="12" fill="#f3f6fb" stroke="#c9d3e3" stroke-width="2"/><rect x="865" y="140" width="250" height="96" rx="12" fill="#0f2c66"/><rect x="865" y="210" width="250" height="26" fill="#0f2c66"/><text x="883" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="start"><tspan x="883" dy="0">Registro oficial</tspan><tspan x="883" dy="30">(e-Estado)</tspan></text><text x="883" y="280" font-size="20" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="883" dy="0">Bens móveis</tspan><tspan x="883" dy="25">registrados; a</tspan><tspan x="883" dy="25">atualização depende</tspan><tspan x="883" dy="25">do lançamento</tspan><tspan x="883" dy="25">central</tspan></text><line x1="1116" y1="340" x2="1138" y2="340" stroke="#1a56b8" stroke-width="3" marker-end="url(#p-1a56b8)"/><line x1="1138" y1="390" x2="1116" y2="390" stroke="#3f4550" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#p-3f4550)"/><rect x="1140" y="140" width="250" height="330" rx="12" fill="#f3f6fb" stroke="#c9d3e3" stroke-width="2"/><rect x="1140" y="140" width="250" height="96" rx="12" fill="#0f2c66"/><rect x="1140" y="210" width="250" height="26" fill="#0f2c66"/><text x="1158" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="start"><tspan x="1158" dy="0">Contabilidade</tspan><tspan x="1158" dy="30">(SIGEF)</tspan></text><text x="1158" y="280" font-size="20" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="1158" dy="0">Lançamentos e</tspan><tspan x="1158" dy="25">conciliação com</tspan><tspan x="1158" dy="25">relatórios extraídos</tspan><tspan x="1158" dy="25">e planilhas</tspan></text><circle cx="280" cy="255" r="17" fill="#c4451c"/><text x="280" y="262" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="280" dy="0">1</tspan></text><circle cx="580" cy="255" r="17" fill="#c4451c"/><text x="580" y="262" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="580" dy="0">2</tspan></text><circle cx="855" cy="255" r="17" fill="#c4451c"/><text x="855" y="262" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="855" dy="0">3</tspan></text><circle cx="1380" cy="255" r="17" fill="#c4451c"/><text x="1380" y="262" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1380" dy="0">4</tspan></text><text x="40" y="510" font-size="19" font-weight="400" fill="#3f4550" text-anchor="start"><tspan x="40" dy="0">Seta cheia: envio de pedidos, bens e informações.   Seta tracejada: retorno de confirmações e pendências.</tspan></text><rect x="40" y="540" width="1320" height="300" rx="12" fill="#fff" stroke="#c9d3e3" stroke-width="2"/><text x="70" y="588" font-size="28" font-weight="800" fill="#0f2c66" text-anchor="start"><tspan x="70" dy="0">Pontos de ruptura</tspan></text><circle cx="87" cy="646" r="17" fill="#c4451c"/><text x="87" y="653" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="87" dy="0">1</tspan></text><text x="120" y="653" font-size="19" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="120" dy="0">O bem muda de sala ou de escola antes de o registro oficial</tspan><tspan x="120" dy="24">ser atualizado; o histórico fica em mensagens e planilhas.</tspan></text><circle cx="737" cy="646" r="17" fill="#c4451c"/><text x="737" y="653" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="737" dy="0">2</tspan></text><text x="770" y="653" font-size="19" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="770" dy="0">Cada unidade mantém sua própria planilha de bens e materiais,</tspan><tspan x="770" dy="24">sem identificação comum nem versão única.</tspan></text><circle cx="87" cy="751" r="17" fill="#c4451c"/><text x="87" y="758" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="87" dy="0">3</tspan></text><text x="120" y="758" font-size="19" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="120" dy="0">O inventário é consolidado manualmente, unidade por unidade,</tspan><tspan x="120" dy="24">a partir de listas e relatórios de formatos diferentes.</tspan></text><circle cx="737" cy="751" r="17" fill="#c4451c"/><text x="737" y="758" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="737" dy="0">4</tspan></text><text x="770" y="758" font-size="19" font-weight="400" fill="#15171c" text-anchor="start"><tspan x="770" dy="0">A conciliação contábil depende de relatórios extraídos e</tspan><tspan x="770" dy="24">ajustados à mão; as diferenças chegam sem origem clara.</tspan></text></svg>