<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" font-family="Inter, Arial, sans-serif"><defs><marker id="p-1a56b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a56b8"/></marker><marker id="p-0f2c66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f2c66"/></marker><marker id="p-3f4550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4550"/></marker><marker id="p-c4451c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4451c"/></marker></defs><rect width="1400" height="1120" fill="#fff"/><text x="40" y="58" font-size="36" font-weight="800" fill="#0f2c66" text-anchor="start"><tspan x="40" dy="0">Fluxo atual por atores: o circuito cotidiano</tspan></text><text x="40" y="96" font-size="22" font-weight="400" fill="#3f4550" text-anchor="start"><tspan x="40" dy="0">Pedido, movimentação, inventário e fechamento. Modelo típico a validar por unidade. Sem o SIMA.</tspan></text><rect x="230" y="120" width="286" height="42" rx="8" fill="#0f2c66"/><text x="244" y="148" font-size="19" font-weight="700" fill="#fff" text-anchor="start"><tspan x="244" dy="0">1. Pedido e recebimento</tspan></text><rect x="522" y="120" width="286" height="42" rx="8" fill="#0f2c66"/><text x="536" y="148" font-size="19" font-weight="700" fill="#fff" text-anchor="start"><tspan x="536" dy="0">2. Movimentação de bens</tspan></text><rect x="814" y="120" width="286" height="42" rx="8" fill="#0f2c66"/><text x="828" y="148" font-size="19" font-weight="700" fill="#fff" text-anchor="start"><tspan x="828" dy="0">3. Inventário anual</tspan></text><rect x="1106" y="120" width="286" height="42" rx="8" fill="#0f2c66"/><text x="1120" y="148" font-size="19" font-weight="700" fill="#fff" text-anchor="start"><tspan x="1120" dy="0">4. Fechamento do período</tspan></text><rect x="40" y="170" width="1320" height="139" fill="#f3f6fb" stroke="#c9d3e3"/><rect x="40" y="170" width="180" height="139" fill="#dbe6f6"/><text x="56" y="230" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Escola /</tspan><tspan x="56" dy="28">unidade</tspan></text><rect x="40" y="315" width="1320" height="139" fill="#fff" stroke="#c9d3e3"/><rect x="40" y="315" width="180" height="139" fill="#dbe6f6"/><text x="56" y="375" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Regional</tspan></text><rect x="40" y="460" width="1320" height="139" fill="#f3f6fb" stroke="#c9d3e3"/><rect x="40" y="460" width="180" height="139" fill="#dbe6f6"/><text x="56" y="520" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Almoxarifado</tspan></text><rect x="40" y="605" width="1320" height="139" fill="#fff" stroke="#c9d3e3"/><rect x="40" y="605" width="180" height="139" fill="#dbe6f6"/><text x="56" y="665" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Patrimônio</tspan></text><rect x="40" y="750" width="1320" height="139" fill="#f3f6fb" stroke="#c9d3e3"/><rect x="40" y="750" width="180" height="139" fill="#dbe6f6"/><text x="56" y="810" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Contabilidade</tspan></text><rect x="40" y="895" width="1320" height="139" fill="#fff" stroke="#c9d3e3"/><rect x="40" y="895" width="180" height="139" fill="#dbe6f6"/><text x="56" y="955" font-size="22" font-weight="700" fill="#0f2c66" text-anchor="start"><tspan x="56" dy="0">Sistemas e</tspan><tspan x="56" dy="28">registros</tspan></text><rect x="238" y="188" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="250" y="226" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="250" dy="0">Identifica a necessidade</tspan><tspan x="250" dy="22">e pede por ofício/SEI</tspan></text><rect x="238" y="478" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="250" y="516" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="250" dy="0">Separa e entrega;</tspan><tspan x="250" dy="22">baixa o estoque no SGA</tspan></text><rect x="238" y="913" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="250" y="951" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="250" dy="0">SGA: saída de estoque</tspan><tspan x="250" dy="22">SEI: processo do pedido</tspan></text><rect x="530" y="188" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="542" y="226" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="542" dy="0">Muda o bem de sala ou</tspan><tspan x="542" dy="22">escola; anota na planilha</tspan></text><rect x="530" y="333" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="542" y="371" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="542" dy="0">Autoriza ou informa</tspan><tspan x="542" dy="22">a transferência</tspan></text><rect x="530" y="623" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="542" y="661" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="542" dy="0">Lança a transferência</tspan><tspan x="542" dy="22">no e-Estado</tspan></text><rect x="530" y="913" width="270" height="103" rx="10" fill="#fff" stroke="#1a56b8" stroke-width="2"/><text x="542" y="951" font-size="18" font-weight="500" fill="#15171c" text-anchor="start"><tspan x="542" dy="0">e-Estado: registro</tspan><tspan x="542" dy="22">oficial do bem móvel</tspan></text><rect x="822" y="188" width="270" height="103" rx="10" fill